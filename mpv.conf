# 视频与缩放
vo=gpu-next
hwdec=auto-copy
scale=ewa_lanczos
cscale=ewa_lanczos
dscale=mitchell
scale-antiring=0.6
cscale-antiring=0.6
correct-downscaling=yes
sigmoid-upscaling=yes
deband=yes

# 界面与续播
osc=no
save-position-on-quit=yes
watch-later-options=start,vid,aid,sid

# 外挂字幕
sub-auto=fuzzy
sub-file-paths=sub;Subs;subtitles
slang=chs,sc,zh-cn,zh,chi,zho,zh-tw,cht

# 音量
volume=50
volume-max=130

# 截图
screenshot-format=png
screenshot-png-compression=4
screenshot-template="%{media-title}-%wH_%wM_%wS-N%04n"

# 本机设置
include=~~/mpv.local.conf

