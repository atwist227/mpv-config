# Anki 字段映射
# 导入 Lapis 示例牌组：https://github.com/donkuri/lapis
deck_name=Lapis
model_name=Lapis
create_deck=yes
sentence_field=Sentence
secondary_field=
audio_field=SentenceAudio
image_field=Picture
note_tag=
use_forvo=no
miscinfo_enable=no

# 字幕复制与菜单
autoclip=yes
nuke_spaces=yes
menu_font_name=sans-serif
menu_font_size=24

# 制卡图片与音频
use_ffmpeg=yes
snapshot_format=jpg
snapshot_quality=50
snapshot_width=800
snapshot_height=-2
audio_format=mp3
audio_bitrate=32k
audio_padding=0.1

# 副字幕
secondary_sub_lang=chi,zh-CN,sc,chs
secondary_sub_area=0.7
secondary_sub_visibility=always

