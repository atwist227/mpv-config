# uosc 菜单
MBTN_RIGHT script-binding uosc/menu

# 鼠标
MBTN_LEFT cycle pause

# 音量
UP    no-osd add volume 5; script-message-to uosc flash-elements volume
DOWN  no-osd add volume -5; script-message-to uosc flash-elements volume
WHEEL_UP    no-osd add volume 1; script-message-to uosc flash-elements volume
WHEEL_DOWN  no-osd add volume -1; script-message-to uosc flash-elements volume

# 全屏联动
ESC    set fullscreen no; set pause yes
ENTER  set fullscreen yes; set pause no

# 跳转
LEFT       no-osd seek -5 exact
Ctrl+LEFT  no-osd seek -1 exact
Ctrl+RIGHT no-osd seek 1 exact

# 右方向键：短按前进 5 秒，长按 3 倍速，松开恢复
RIGHT no-osd seek 5 exact                         #@click
RIGHT no-osd set speed 3; no-osd set pause no    #@press
RIGHT ignore                                      #@release